<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Longueur d'onde</title>
<meta name="description" content="Longueur d'onde en ligne : crée une room, partage le code, devinez la cible.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 24'%3E%3Cpath d='M2 22A18 18 0 0 1 38 22Z' fill='%23a9e5cf'/%3E%3Cpath d='M20 22L24 4.5A18 18 0 0 1 29 6.5Z' fill='%23e4483a'/%3E%3Ccircle cx='20' cy='22' r='4' fill='%23b5142f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: une colonne centrée façon boîte de jeu — bande rayée du couvercle, plateau en plastique bleu, le cadran au centre de chaque écran. */
:root {
  --ink: #0f1a33;
  --board: #1d3c74;
  --board-hi: #2a4f92;
  --face: #a9e5cf;
  --knob: #b5142f;
  --b2: #f39c32; --b3: #e4483a; --b4: #6f86a8;
  --text: #f4f1e8;
  --muted: #a6b5d4;
  --card-l: #bcd9f2; --card-r: #f6c9d6; --card-ink: #1b2440;
  --line: rgba(244,241,232,.14);
  --display: "Dela Gothic One", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--ink) }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
[hidden] { display: none !important }
.stripes {
  height: 12px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  background: repeating-linear-gradient(90deg,
    #e94f37 0 18px, #f6c445 18px 34px, #3a7ca5 34px 52px, #f2a0b5 52px 66px,
    #3ebd93 66px 84px, #14161c 84px 92px, #f7f3e8 92px 108px, #f08a3e 108px 122px);
}
main { max-width: 560px; margin: 0 auto; padding-top: 22px; display: grid; gap: 20px }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.1 }
h1 { font-size: clamp(2rem, 8vw, 2.9rem); letter-spacing: -.01em }
h2 { font-size: clamp(1.4rem, 5.5vw, 1.9rem) }
p { margin: 0 }
.eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: .72rem; font-weight: 800; color: var(--muted) }
.muted { color: var(--muted) }
.center { text-align: center }

.board {
  background: linear-gradient(180deg, var(--board-hi), var(--board));
  border-radius: 22px; padding: 18px 16px 20px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.08), 0 18px 40px rgba(0,0,0,.35);
  display: grid; gap: 16px;
}
.dial { width: 100%; max-width: 100%; height: auto; display: block; touch-action: none; user-select: none; -webkit-user-select: none }
.dial.interactive { cursor: grab }
.dial:focus-visible { outline: 3px solid var(--b2); outline-offset: 4px; border-radius: 12px }
.cover { transform-box: view-box; transform-origin: 210px 222px; transition: transform 1.1s cubic-bezier(.6,.05,.25,1) }
.dial.open .cover { transform: rotate(-180deg) }
.needle { transition: transform .12s ease-out }
.dial.dragging .needle { transition: none }
.rev-needle { transform-box: view-box; transform-origin: 210px 222px; animation: swing .9s cubic-bezier(.3,1.4,.5,1) both; animation-delay: var(--d, 0s) }
@keyframes swing { from { transform: rotate(var(--from)) } }

.card {
  display: grid; grid-template-columns: 1fr 1fr; border-radius: 12px; overflow: hidden;
  color: var(--card-ink); font-weight: 800; font-size: clamp(1rem, 4.2vw, 1.2rem);
  box-shadow: 0 4px 0 rgba(0,0,0,.25);
}
.card > div { padding: 12px 14px; display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere }
.card .l { background: var(--card-l) }
.card .r { background: var(--card-r); text-align: right }
.card small { font-size: .78rem; opacity: .6 }

.clue { text-align: center; font-family: var(--display); font-size: clamp(1.4rem, 6vw, 2rem); overflow-wrap: anywhere; padding: 4px 0 }
.clue::before { content: "« "; color: var(--b2) }
.clue::after { content: " »"; color: var(--b2) }

button {
  font: inherit; font-weight: 800; border: 0; border-radius: 999px; cursor: pointer;
  padding: 14px 22px; background: var(--b2); color: var(--card-ink);
  box-shadow: 0 4px 0 #b06a17; transition: transform .08s, box-shadow .08s;
}
button:active { transform: translateY(3px); box-shadow: 0 1px 0 #b06a17 }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--face); outline-offset: 2px }
button.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 2px var(--line) }
button.ghost:active { box-shadow: inset 0 0 0 2px var(--muted) }
button.small { padding: 8px 14px; font-size: .9rem }
button:disabled { opacity: .45; cursor: not-allowed }
.linkish { all: unset; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: var(--text) }
.linkish:focus-visible { outline: 2px solid var(--face); outline-offset: 2px }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.row > * { min-width: 0 }
.wide { width: 100% }
.grow { flex: 1 }

input, select {
  font: inherit; color: var(--text); background: rgba(0,0,0,.25);
  border: 2px solid var(--line); border-radius: 12px; padding: 11px 13px; width: 100%; min-width: 0;
}
input.code-in { text-transform: uppercase; letter-spacing: .3em; font-weight: 800; text-align: center; font-size: 1.2rem }
label { display: grid; gap: 6px; font-weight: 600; font-size: .92rem }
.or { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; color: var(--muted); font-size: .85rem; font-weight: 600 }
.or::before, .or::after { content: ""; height: 2px; background: var(--line) }

.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); flex: none }
.scorebar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip {
  display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px 4px 8px; border-radius: 999px;
  background: rgba(255,255,255,.06); font-size: .85rem; font-weight: 600; font-variant-numeric: tabular-nums;
}
.chip.psy { box-shadow: inset 0 0 0 2px var(--b2) }
.chip.off { opacity: .4 }
.chip.done::after { content: "✓"; color: var(--face); font-weight: 800 }

.code-big {
  font-family: var(--display); font-size: clamp(3rem, 16vw, 4.6rem); letter-spacing: .12em; line-height: 1;
  color: var(--face); text-align: center;
}
.list { display: grid; gap: 6px; font-variant-numeric: tabular-nums }
.item {
  display: grid; grid-template-columns: 14px 1fr auto auto; gap: 10px; align-items: center;
  padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,.18);
}
.item .name { min-width: 0; overflow-wrap: anywhere; font-weight: 600 }
.item.off { opacity: .45 }
.pts { font-family: var(--display); font-size: 1.2rem; min-width: 2.2ch; text-align: right }
.tag { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 999px; background: var(--b4); color: var(--text); white-space: nowrap }
.tag.best { background: var(--b2); color: var(--card-ink) }
.tag.you { background: transparent; box-shadow: inset 0 0 0 2px var(--line) }
.podium .item:first-child { background: rgba(243,156,50,.22) }
.podium .item:first-child .pts { color: var(--b2) }

.wait { display: flex; gap: 10px; align-items: center; justify-content: center; color: var(--muted); font-weight: 600; text-align: center }
.wait::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--b2); animation: pulse 1.2s ease-in-out infinite; flex: none }
@keyframes pulse { 50% { opacity: .25; transform: scale(.7) } }

.rules { display: grid; gap: 8px; font-size: .92rem; color: var(--muted) }
.rules b { color: var(--text) }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; font-weight: 600 }
.legend span { display: inline-flex; gap: 6px; align-items: center }
.sw { width: 12px; height: 12px; border-radius: 3px; background: var(--c) }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--text); color: var(--card-ink); font-weight: 700; padding: 12px 18px; border-radius: 12px;
  max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 20;
}
.conn { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); font-size: .8rem; font-weight: 700; background: var(--b3); color: var(--text); padding: 6px 12px; border-radius: 999px; z-index: 20 }

.mute {
  position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 19;
  width: 40px; height: 40px; padding: 0; display: grid; place-items: center;
  background: var(--board); color: var(--text); box-shadow: inset 0 0 0 2px var(--line);
}
.mute:active { transform: none; box-shadow: inset 0 0 0 2px var(--muted) }
.mute .cross { display: none }
.mute[aria-pressed="true"] .cross { display: inline }
.mute[aria-pressed="true"] .waves { display: none }
.mute[aria-pressed="true"] { color: var(--muted) }
.conn { right: auto; left: max(16px, env(safe-area-inset-left, 0px)) }
main { padding-top: 64px }

@media (prefers-reduced-motion: reduce) {
  .cover, .needle { transition: none }
  .rev-needle, .wait::before { animation: none }
}
</style>
</head>
<body>
<div class="stripes" aria-hidden="true"></div>
<main id="app"></main>
<div class="toast" id="toast" role="status" hidden></div>
<div class="conn" id="conn" hidden>Reconnexion…</div>
<button class="mute" id="mute" aria-pressed="false" aria-label="Couper le son" title="Son">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path class="cross" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
/* ---------- Utils ---------- */
const Z4 = 1.8, Z3 = 5.4, Z2 = 9;
const CX = 210, CY = 222, R = 180;
const pt = (v, r = R) => { const a = Math.PI * (1 - v / 100); return [CX + r * Math.cos(a), CY - r * Math.sin(a)]; };
const rot = v => (v - 50) * 1.8;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, f) { try { const v = localStorage.getItem(k); return v === null ? f : v; } catch { return f; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const $ = id => document.getElementById(id);
const app = $('app');

let myId = store.get('lo-id', null);
if (!myId) { myId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); store.set('lo-id', myId); }

let urlCode = (location.pathname.match(/^\/([A-Za-z]{4})$/) || [])[1]?.toUpperCase() || null;
let S = null;            // dernier état reçu du serveur
let key = '';            // identifie l'écran affiché, pour ne pas tout redessiner à chaque mise à jour
let live = 50;           // position locale de l'aiguille
let draft = { clue: '', left: '', right: '', custom: false };

/* ---------- Sound design (Web Audio, tout est synthétisé) ---------- */
const sfx = (() => {
  let ctx = null, master = null;
  let muted = store.get('lo-mute', '0') === '1';
  const ac = () => {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      ctx = new C(); master = ctx.createGain(); master.gain.value = .9;
      const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  // Les navigateurs n'autorisent le son qu'après un geste de l'utilisateur
  const unlock = () => { ac(); };
  ['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, unlock, { once: true, capture: true }));

  function tone({ f = 440, f2 = null, dur = .12, type = 'sine', vol = .15, at = 0, attack = .005, lp = null }) {
    const c = ac(); if (!c || muted) return;
    const t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    let node = o;
    if (lp) { const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); node = fl; }
    node.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + .05);
  }
  function noise({ dur = .8, vol = .12, at = 0, from = 300, to = 2500, q = 1.2 }) {
    const c = ac(); if (!c || muted) return;
    const t = c.currentTime + at;
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q;
    bp.frequency.setValueAtTime(from, t); bp.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * .35); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(master); src.start(t); src.stop(t + dur);
  }
  const bell = (f, at = 0, vol = .12, dur = .5) => { tone({ f, dur, vol, at }); tone({ f: f * 2, dur: dur * .6, vol: vol * .3, at }); };
  const arp = (notes, step = .09, vol = .12, dur = .45) => notes.forEach((f, i) => bell(f, i * step, vol, dur));

  return {
    get muted() { return muted; },
    toggle() { muted = !muted; store.set('lo-mute', muted ? '1' : '0'); if (!muted) this.tap(); return muted; },
    tap()     { tone({ f: 520, f2: 430, dur: .07, type: 'triangle', vol: .09 }); },
    tick()    { tone({ f: 2300, dur: .018, type: 'square', vol: .025, lp: 4000 }); },
    lock()    { tone({ f: 330, dur: .08, type: 'triangle', vol: .14 }); bell(660, .07, .12, .3); bell(990, .14, .1, .4); },
    join()    { tone({ f: 520, f2: 820, dur: .14, type: 'sine', vol: .1 }); },
    leave()   { tone({ f: 600, f2: 380, dur: .16, type: 'sine', vol: .07 }); },
    blip()    { tone({ f: 880, dur: .06, type: 'sine', vol: .06 }); },
    yourTurn() { arp([523, 659, 784, 1047], .1, .12, .6); },
    newRound() { arp([392, 523], .08, .08, .35); },
    clueIn()  { bell(784, 0, .12, .4); bell(1175, .1, .1, .6); },
    open()    { noise({ dur: .9, vol: .07, from: 250, to: 2200 }); tone({ f: 70, f2: 50, dur: .9, type: 'sine', vol: .12 }); },
    score(p) {
      if (p <= 0) { tone({ f: 330, f2: 196, dur: .5, type: 'sawtooth', vol: .07, lp: 900 }); tone({ f: 311, f2: 185, dur: .6, type: 'sawtooth', vol: .05, at: .35, lp: 700 }); return; }
      const scale = [523, 659, 784, 1047, 1319];
      arp(scale.slice(0, p), .09, .12, .5);
      if (p >= 4) { [1568, 2093, 2637].forEach((f, i) => tone({ f, dur: .25, vol: .05, at: .45 + i * .05 })); noise({ dur: .4, vol: .03, at: .45, from: 4000, to: 9000, q: .7 }); }
    },
    win()  { arp([523, 659, 784, 1047], .12, .13, .5); [523, 659, 784, 1047].forEach(f => tone({ f, dur: 1.4, vol: .05, at: .55, type: 'triangle' })); },
    lose() { arp([392, 494, 587], .12, .1, .5); },
  };
})();

let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

/* ---------- Cadran ---------- */
function wedge(a, b, fill) {
  a = Math.max(0, a); b = Math.min(100, b);
  const [x1, y1] = pt(a), [x2, y2] = pt(b);
  return `<path d="M${CX} ${CY}L${x1.toFixed(2)} ${y1.toFixed(2)}A${R} ${R} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z" fill="${fill}"/>`;
}
function dial({ target = null, needles = [], needle = null, open = false, interactive = false, id = 'dial' }) {
  let bands = '';
  if (target !== null) {
    const t = target;
    bands = wedge(t - Z2, t - Z3, 'var(--b2)') + wedge(t - Z3, t - Z4, 'var(--b3)') + wedge(t - Z4, t + Z4, 'var(--b4)')
          + wedge(t + Z4, t + Z3, 'var(--b3)') + wedge(t + Z3, t + Z2, 'var(--b2)');
    [[-7.2, 2], [-3.6, 3], [0, 4], [3.6, 3], [7.2, 2]].forEach(([o, n]) => {
      const v = t + o; if (v < 1 || v > 99) return;
      const [x, y] = pt(v, R - 22);
      bands += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-family="Figtree, sans-serif" font-weight="800" font-size="13" fill="#1b2440" transform="rotate(${rot(v)} ${x.toFixed(1)} ${y.toFixed(1)})">${n}</text>`;
    });
  }
  const ticks = Array.from({ length: 11 }, (_, i) => {
    const [x1, y1] = pt(i * 10, R + 3), [x2, y2] = pt(i * 10, R + (i % 5 ? 8 : 13));
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1d3c74" stroke-width="2" stroke-linecap="round"/>`;
  }).join('');
  const stars = [[150,120],[260,90],[300,160],[120,180],[210,70],[340,140],[90,150],[240,170]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 3 ? 1.2 : 1.8}" fill="#9fb3dd" opacity=".55"/>`).join('');
  const rev = needles.map((n, i) => `<g class="rev-needle" style="--from:${-rot(n.v)}deg;--d:${(.9 + i * .15).toFixed(2)}s">
      <g transform="rotate(${rot(n.v)} ${CX} ${CY})">
        <line x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY - R + 6}" stroke="${n.color}" stroke-width="4" stroke-linecap="round"/>
        <circle cx="${CX}" cy="${CY - R + 6}" r="11" fill="${n.color}" stroke="#0f1a33" stroke-width="2"/>
        <text x="${CX}" y="${CY - R + 6}" text-anchor="middle" dominant-baseline="central" font-family="Figtree, sans-serif" font-weight="800" font-size="11" fill="#0f1a33">${esc(n.label)}</text>
      </g></g>`).join('');
  const main = needle === null ? '' : `<g class="needle" transform="rotate(${rot(needle)} ${CX} ${CY})">
      <line x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY - R + 14}" stroke="var(--knob)" stroke-width="7" stroke-linecap="round"/></g>`;
  const aria = interactive ? `tabindex="0" role="slider" aria-label="Position de l'aiguille" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(needle)}"` : `role="img" aria-label="Cadran"`;
  return `<svg id="${id}" class="dial${open ? ' open' : ''}${interactive ? ' interactive' : ''}" viewBox="0 0 420 252" ${aria}>
    <defs><clipPath id="${id}-top"><rect x="0" y="0" width="420" height="${CY}"/></clipPath></defs>
    <path d="M${CX - R - 14} ${CY}A${R + 14} ${R + 14} 0 0 1 ${CX + R + 14} ${CY}Z" fill="#f4f1e8"/>
    <path d="M${CX - R - 13} ${CY}A${R + 13} ${R + 13} 0 0 1 ${CX + R + 13} ${CY}" fill="none" stroke="#f4f1e8" stroke-width="12" stroke-dasharray="0 14.3" stroke-linecap="round"/>
    <path d="M${CX - R} ${CY}A${R} ${R} 0 0 1 ${CX + R} ${CY}Z" fill="var(--face)"/>
    ${bands}${ticks}
    <g clip-path="url(#${id}-top)"><g class="cover">
      <path d="M${CX - R - 1} ${CY}A${R + 1} ${R + 1} 0 0 1 ${CX + R + 1} ${CY}Z" fill="#14264d"/>
      ${stars}
      <path d="M${CX - R + 26} ${CY}A${R - 26} ${R - 26} 0 0 1 ${CX + R - 26} ${CY}" fill="none" stroke="#2a4f92" stroke-width="2" stroke-dasharray="3 7"/>
    </g></g>
    <rect x="${CX - R - 30}" y="${CY - 4}" width="${2 * R + 60}" height="34" rx="10" fill="#14264d"/>
    <rect x="${CX - R - 26}" y="${CY - 4}" width="44" height="9" rx="4.5" fill="var(--face)"/>
    <rect x="${CX + R - 18}" y="${CY - 4}" width="44" height="9" rx="4.5" fill="var(--face)"/>
    ${rev}${main}
    <circle cx="${CX}" cy="${CY}" r="24" fill="var(--knob)"/><circle cx="${CX}" cy="${CY}" r="15" fill="#d01e3b"/>
  </svg>`;
}
const openDial = id => requestAnimationFrame(() => requestAnimationFrame(() => $(id)?.classList.add('open')));

function bindDrag(svg) {
  const needle = svg.querySelector('.needle');
  let notch = Math.round(live / 2);
  const set = v => {
    live = Math.max(0, Math.min(100, v));
    const n = Math.round(live / 2);
    if (n !== notch) { notch = n; sfx.tick(); }
    needle.setAttribute('transform', `rotate(${rot(live)} ${CX} ${CY})`);
    svg.setAttribute('aria-valuenow', Math.round(live));
  };
  const fromEvent = e => {
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(svg.getScreenCTM().inverse());
    let a = Math.atan2(CY - q.y, q.x - CX);
    if (a < 0) a = q.x < CX ? Math.PI : 0;
    set((1 - a / Math.PI) * 100);
  };
  svg.addEventListener('pointerdown', e => { svg.setPointerCapture(e.pointerId); svg.classList.add('dragging'); fromEvent(e); });
  svg.addEventListener('pointermove', e => { if (svg.hasPointerCapture(e.pointerId)) fromEvent(e); });
  const end = () => svg.classList.remove('dragging');
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  svg.addEventListener('keydown', e => {
    const step = e.shiftKey ? 5 : 1;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { set(live - step); e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { set(live + step); e.preventDefault(); }
  });
}

/* ---------- Réseau ---------- */
const socket = io();
socket.on('connect', () => {
  $('conn').hidden = true;
  const code = S?.code || urlCode;
  const name = store.get('lo-name', '');
  if (code && (name || S)) socket.emit('join', { id: myId, name, code });
  else if (!S) render();
});
socket.on('disconnect', () => { $('conn').hidden = false; });
function playTransition(prev, st) {
  if (!prev) return;
  const meId = st.you, psy = st.psychicId === meId;
  const nowOn = st.players.filter(p => p.connected).length, wasOn = prev.players.filter(p => p.connected).length;
  if (prev.phase !== st.phase || prev.round !== st.round) {
    if (st.phase === 'clue') psy ? sfx.yourTurn() : sfx.newRound();
    else if (st.phase === 'guess' && !psy) sfx.clueIn();
    else if (st.phase === 'reveal') {
      sfx.open();
      const r = st.results;
      const mine = psy ? r.psyPts * 2 - 1 : (r.rows.find(x => x.id === meId) || null);
      const pts = mine === null ? null : typeof mine === 'number' ? Math.max(0, mine) : mine.pts + mine.bonus;
      if (pts !== null) setTimeout(() => sfx.score(Math.min(pts, 5)), 1250);
    }
    else if (st.phase === 'end') {
      const top = Math.max(...st.players.map(p => p.score));
      (st.players.find(p => p.id === meId)?.score === top) ? sfx.win() : sfx.lose();
    }
    return;
  }
  if (nowOn > wasOn) sfx.join();
  else if (nowOn < wasOn) sfx.leave();
  if (st.phase === 'guess' && st.locked.length > prev.locked.length && !st.locked.every(id => prev.locked.includes(id)) && st.myGuess === prev.myGuess) sfx.blip();
}

socket.on('state', st => {
  playTransition(S, st);
  S = st;
  store.set('lo-room', st.code);
  if (location.pathname !== '/' + st.code) history.replaceState(null, '', '/' + st.code);
  render();
});
socket.on('fail', msg => {
  toast(msg);
  if (!S) {
    if (urlCode) { urlCode = null; history.replaceState(null, '', '/'); }
    render(true);
  }
});

/* ---------- Écrans ---------- */
const me = () => S.players.find(p => p.id === S.you);
const P = id => S.players.find(p => p.id === id) || { name: '?', color: '#888' };
const isHost = () => S.hostId === S.you;
const isPsy = () => S.psychicId === S.you;
const cardHTML = c => `<div class="card"><div class="l"><small>←</small>${esc(c[0])}</div><div class="r"><small>→</small>${esc(c[1])}</div></div>`;

const chipsHTML = () => S.players.map(p => {
  const cls = ['chip', p.id === S.psychicId && S.phase !== 'lobby' ? 'psy' : '', p.connected ? '' : 'off', S.phase === 'guess' && S.locked.includes(p.id) ? 'done' : ''].join(' ');
  return `<span class="${cls}" title="${p.connected ? '' : 'Déconnecté'}"><span class="dot" style="--c:${p.color}"></span>${esc(p.name)}${p.id === S.hostId ? ' ★' : ''} ${S.phase === 'lobby' ? '' : p.score}</span>`;
}).join('');
const scorebar = () => `<div class="scorebar">
  <span class="eyebrow">Room ${S.code} · Manche ${S.round + 1} / ${S.totalRounds} · <button class="linkish" data-act="leave">Quitter</button></span>
  <div class="chips" id="chips">${chipsHTML()}</div></div>`;
const hostTools = () => isHost() ? `<div class="row" style="justify-content:center"><button class="ghost small" data-act="skip">Passer cette manche</button></div>` : '';

function waitingGuessers() {
  return S.players.filter(p => p.id !== S.psychicId && p.inRound && p.connected && !S.locked.includes(p.id));
}

const screens = {
  home() {
    const name = store.get('lo-name', '');
    const last = store.get('lo-room', null);
    return `
      <header style="display:grid;gap:8px">
        <span class="eyebrow">Jeu d'ambiance en ligne · 2 à 12 joueurs</span>
        <h1>Longueur d'onde</h1>
        <p class="muted">Un meneur voit la cible cachée sur le cadran et donne un indice. Chacun place son aiguille sur son téléphone. Le plus proche gagne.</p>
      </header>
      <section class="board">
        ${dial({ id: 'demo', target: 68, needle: 63, open: true })}
        ${cardHTML(['Froid', 'Chaud'])}
        <p class="clue" style="font-size:1.3rem">Un café oublié 10 minutes</p>
      </section>
      <form class="board" id="home-form" novalidate>
        <label for="name">Ton pseudo
          <input id="name" maxlength="18" autocomplete="nickname" placeholder="Ex. Inès" value="${esc(name)}">
        </label>
        ${last && last !== urlCode ? `<button type="button" class="ghost wide" data-act="rejoin">Revenir dans la room ${esc(last)}</button>` : ''}
        <button type="submit" data-mode="${urlCode ? 'join' : 'create'}" class="wide">${urlCode ? `Rejoindre la room ${urlCode}` : 'Créer une room'}</button>
        <div class="or">${urlCode ? 'ou une autre room' : 'ou rejoindre avec un code'}</div>
        <div class="row" style="flex-wrap:nowrap">
          <input id="code" class="code-in grow" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" aria-label="Code de la room">
          <button type="submit" data-mode="join-code" class="ghost">Rejoindre</button>
        </div>
        ${urlCode ? '<button type="submit" data-mode="create" class="ghost wide">Créer une nouvelle room</button>' : ''}
      </form>
      ${rulesHTML()}`;
  },
  lobby() {
    const link = `${location.origin}/${S.code}`;
    const n = S.players.filter(p => p.connected).length;
    return `
      <section class="board center" style="gap:10px">
        <span class="eyebrow">Code de la room</span>
        <div class="code-big">${S.code}</div>
        <div class="row" style="justify-content:center;flex-wrap:nowrap">
          <input id="link" readonly value="${esc(link)}" aria-label="Lien d'invitation" style="font-size:.85rem">
          <button class="small" data-act="copy">Copier</button>
        </div>
        <p class="muted" style="font-size:.85rem">Envoie ce lien à tes amis, ou donne-leur le code.</p>
      </section>
      <section class="board">
        <h2>Joueurs (${n})</h2>
        <div class="list">${S.players.map(p => `
          <div class="item${p.connected ? '' : ' off'}"><span class="dot" style="--c:${p.color}"></span>
            <span class="name">${esc(p.name)}</span>
            <span>${p.id === S.hostId ? '<span class="tag">Hôte</span>' : ''}</span>
            <span>${p.id === S.you ? '<span class="tag you">Toi</span>' : ''}</span></div>`).join('')}
        </div>
        ${isHost() ? `
          <label for="laps">Nombre de tours
            <select id="laps">${[1, 2, 3, 4, 5].map(l => `<option value="${l}" ${l === S.laps ? 'selected' : ''}>${l} tour${l > 1 ? 's' : ''} : chacun est meneur ${l} fois</option>`).join('')}</select>
          </label>
          <button class="wide" data-act="start" ${n < 2 ? 'disabled' : ''}>${n < 2 ? 'En attente d\'un 2e joueur…' : `Lancer la partie (${n * S.laps} manches)`}</button>`
        : `<p class="muted">${S.laps} tour${S.laps > 1 ? 's' : ''} : chacun sera meneur ${S.laps} fois.</p>
           <p class="wait">${esc(P(S.hostId).name)} va lancer la partie</p>`}
        <button class="ghost small" data-act="leave" style="justify-self:start">Quitter la room</button>
      </section>
      ${rulesHTML()}`;
  },
  clue() {
    if (!isPsy()) return `${scorebar()}<section class="board">
        ${cardHTML(S.card)}
        ${dial({ id: 'd' })}
        <p class="wait">${esc(P(S.psychicId).name)} regarde la cible et cherche un indice…</p>
      </section>${hostTools()}`;
    return `${scorebar()}<section class="board">
      <span class="eyebrow" style="color:${me().color}">Tu es le meneur · toi seul vois la cible</span>
      ${draft.custom ? `<div class="row" style="flex-wrap:nowrap">
          <label class="grow">Gauche<input id="cl" value="${esc(draft.left)}" maxlength="30" placeholder="Ex. Nul"></label>
          <label class="grow">Droite<input id="cr" value="${esc(draft.right)}" maxlength="30" placeholder="Ex. Génial"></label></div>`
        : cardHTML(S.card)}
      ${dial({ id: 'd', target: S.target })}
      <div class="row">
        <button class="ghost small" data-act="reroll" ${draft.custom ? 'hidden' : ''}>Autre carte</button>
        <button class="ghost small" data-act="custom">${draft.custom ? 'Revenir aux cartes' : 'Thème libre'}</button>
      </div>
      <form id="clue-form" style="display:grid;gap:12px" novalidate>
        <label for="clue-in">Ton indice
          <input id="clue-in" value="${esc(draft.clue)}" maxlength="60" placeholder="Un mot ou une phrase" autocomplete="off">
        </label>
        <button type="submit" class="wide">Envoyer l'indice</button>
      </form>
    </section>${hostTools()}`;
  },
  guess() {
    const clue = S.clue ? `<p class="clue">${esc(S.clue)}</p>` : `<p class="muted center">Indice donné à voix haute</p>`;
    const waiting = waitingGuessers();
    const waitTxt = waiting.length ? `En attente de ${waiting.map(p => esc(p.name)).join(', ')}` : 'Révélation…';
    if (isPsy()) return `${scorebar()}<section class="board">
        <span class="eyebrow" style="color:${me().color}">Ton indice · les autres devinent</span>
        ${cardHTML(S.card)}${clue}
        ${dial({ id: 'd', target: S.target, open: true })}
        <p class="wait" id="waittxt">${waitTxt}</p>
        <button class="ghost small" data-act="reveal" style="justify-self:center" ${S.locked.length ? '' : 'disabled'}>Révéler sans attendre</button>
      </section>${hostTools()}`;
    const mine = me();
    if (!mine.inRound) return `${scorebar()}<section class="board">${cardHTML(S.card)}${clue}${dial({ id: 'd' })}
        <p class="wait">Tu joues dès la prochaine manche</p></section>`;
    if (S.myGuess !== null) return `${scorebar()}<section class="board">
        ${cardHTML(S.card)}${clue}
        ${dial({ id: 'd', needle: S.myGuess })}
        <p class="wait" id="waittxt">${waitTxt}</p>
      </section>${hostTools()}`;
    return `${scorebar()}<section class="board">
      <span class="eyebrow" style="color:${mine.color}">Indice de ${esc(P(S.psychicId).name)}</span>
      ${cardHTML(S.card)}${clue}
      ${dial({ id: 'g', needle: live, interactive: true })}
      <p class="muted center" style="font-size:.85rem">Fais glisser l'aiguille, puis valide. Les autres ne voient pas ta réponse.</p>
      <button class="wide" data-act="lock">Valider ma position</button>
    </section>${hostTools()}`;
  },
  reveal() {
    const { rows, psyPts } = S.results;
    const needles = rows.map(r => ({ v: r.v, color: P(r.id).color, label: (P(r.id).name[0] || '?').toUpperCase() }));
    const last = S.round + 1 >= S.totalRounds;
    const canNext = isHost() || isPsy();
    return `${scorebar()}<section class="board">
      ${cardHTML(S.card)}
      ${S.clue ? `<p class="clue">${esc(S.clue)}</p>` : ''}
      ${dial({ id: 'd', target: S.target, needles })}
      <div class="list">
        ${rows.map(r => `<div class="item"><span class="dot" style="--c:${P(r.id).color}"></span>
          <span class="name">${esc(P(r.id).name)}${r.id === S.you ? ' <span class="muted">(toi)</span>' : ''}</span>
          <span>${r.bonus ? '<span class="tag best">Le plus proche +1</span>' : r.pts === 4 ? '<span class="tag">Pile !</span>' : ''}</span>
          <span class="pts">+${r.pts + r.bonus}</span></div>`).join('')}
        <div class="item"><span class="dot" style="--c:${P(S.psychicId).color}"></span>
          <span class="name">${esc(P(S.psychicId).name)} <span class="muted">(meneur)</span></span><span></span>
          <span class="pts">+${psyPts}</span></div>
      </div>
      ${canNext ? `<button class="wide" data-act="next">${last ? 'Voir le classement' : 'Manche suivante'}</button>`
        : `<p class="wait">${esc(P(S.hostId).name)} lance la manche suivante</p>`}
    </section>`;
  },
  end() {
    const ranked = S.players.slice().sort((a, b) => b.score - a.score);
    const top = ranked[0].score, winners = ranked.filter(p => p.score === top);
    return `<section class="board center" style="gap:10px">
        <span class="eyebrow">Fin de partie · Room ${S.code} · ${S.totalRounds} manches</span>
        <h2 style="color:${winners[0].color}">${winners.length > 1 ? 'Égalité ! ' + winners.map(w => esc(w.name)).join(' & ') : esc(winners[0].name) + ' gagne !'}</h2>
      </section>
      <section class="list podium">
        ${ranked.map((p, k) => `<div class="item${p.connected ? '' : ' off'}"><span class="dot" style="--c:${p.color}"></span>
          <span class="name">${k + 1}. ${esc(p.name)}</span><span>${p.id === S.you ? '<span class="tag you">Toi</span>' : ''}</span><span class="pts">${p.score}</span></div>`).join('')}
      </section>
      ${isHost() ? `<div class="row"><button class="grow" data-act="start">Rejouer</button><button class="ghost grow" data-act="lobby">Retour au salon</button></div>`
        : `<p class="wait">${esc(P(S.hostId).name)} peut relancer une partie</p>`}
      <button class="ghost small" data-act="leave" style="justify-self:center">Quitter la room</button>`;
  },
};

function rulesHTML() {
  return `<section class="rules">
    <span class="eyebrow">Comment on marque</span>
    <div class="legend"><span><i class="sw" style="--c:var(--b4)"></i>Pile dessus · 4 pts</span><span><i class="sw" style="--c:var(--b3)"></i>Très proche · 3 pts</span><span><i class="sw" style="--c:var(--b2)"></i>Proche · 2 pts</span></div>
    <p><b>Devineurs :</b> les points de la zone où tombe ton aiguille. Le devineur le plus proche gagne <b>+1 bonus</b> (dès 2 devineurs).</p>
    <p><b>Meneur :</b> la moitié (arrondie au-dessus) du meilleur score de la manche. Un bon indice rapporte.</p>
    <p><b>À 2 joueurs :</b> vous alternez, l'un mène, l'autre devine.</p>
  </section>`;
}

/* ---------- Rendu ---------- */
function screenKey() {
  if (!S) return 'home';
  return [S.phase, S.round, S.psychicId, S.phase === 'clue' ? S.card.join('|') + draft.custom : '', S.myGuess !== null, me()?.inRound].join('#');
}

function render(force) {
  const k = screenKey();
  if (k === key && !force && S && !['lobby', 'end'].includes(S.phase)) {
    // Même écran : on met à jour seulement ce qui bouge, sans casser l'aiguille ou un champ en cours de saisie
    if ($('chips')) $('chips').innerHTML = chipsHTML();
    if ($('waittxt')) { const w = waitingGuessers(); $('waittxt').textContent = w.length ? 'En attente de ' + w.map(p => p.name).join(', ') : 'Révélation…'; }
    const rv = app.querySelector('[data-act="reveal"]'); if (rv) rv.disabled = !S.locked.length;
    return;
  }
  const prev = key; key = k;
  if (S && prev.split('#')[0] + prev.split('#')[1] !== S.phase + S.round) {
    // nouvelle phase ou nouvelle manche
    if (S.phase === 'clue') draft = { clue: '', left: '', right: '', custom: false };
    if (S.phase === 'guess') live = 50;
    window.scrollTo(0, 0);
  }
  app.innerHTML = S ? screens[S.phase]() : screens.home();
  bind();
}

function bind() {
  if (!S) {
    const form = $('home-form');
    // Entrée dans le champ code = rejoindre (sinon le navigateur prend le premier bouton : créer)
    $('code')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); form.querySelector('[data-mode="join-code"]').click(); } });
    form.addEventListener('submit', e => {
      e.preventDefault();
      const name = $('name').value.trim();
      if (!name) { toast('Choisis un pseudo.'); $('name').focus(); return; }
      store.set('lo-name', name);
      const typed = $('code').value.trim().toUpperCase();
      const mode = e.submitter?.dataset.mode || (typed ? 'join-code' : urlCode ? 'join' : 'create');
      if (mode === 'create') { socket.emit('create', { id: myId, name }); return; }
      const code = mode === 'join' ? urlCode : typed;
      if (!/^[A-Z]{4}$/.test(code || '')) { toast('Le code fait 4 lettres.'); $('code').focus(); return; }
      socket.emit('join', { id: myId, name, code });
    });
    return;
  }
  if (S.phase === 'lobby') {
    $('laps')?.addEventListener('change', e => socket.emit('settings', { laps: +e.target.value }));
  }
  if (S.phase === 'clue' && isPsy()) {
    openDial('d');
    const sync = () => {
      draft.clue = $('clue-in').value;
      if (draft.custom) { draft.left = $('cl').value; draft.right = $('cr').value; }
    };
    ['clue-in', 'cl', 'cr'].forEach(id => $(id)?.addEventListener('input', sync));
    $('clue-form').addEventListener('submit', e => {
      e.preventDefault(); sync();
      if (draft.custom && (!draft.left.trim() || !draft.right.trim())) { toast('Remplis les deux extrêmes de ton thème.'); return; }
      socket.emit('clue', draft.custom ? { clue: draft.clue, left: draft.left, right: draft.right } : { clue: draft.clue });
    });
  }
  if (S.phase === 'guess' && $('g')) bindDrag($('g'));
  if (S.phase === 'reveal') openDial('d');
}

const muteBtn = $('mute');
const syncMute = () => { muteBtn.setAttribute('aria-pressed', sfx.muted); muteBtn.setAttribute('aria-label', sfx.muted ? 'Activer le son' : 'Couper le son'); };
syncMute();
muteBtn.addEventListener('click', () => { sfx.toggle(); syncMute(); });

app.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (btn && !btn.disabled && btn.dataset.act !== 'lock') sfx.tap();
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  switch (act) {
    case 'copy': {
      const inp = $('link');
      const done = () => toast('Lien copié !');
      if (navigator.clipboard) navigator.clipboard.writeText(inp.value).then(done, () => { inp.select(); });
      else inp.select();
      break;
    }
    case 'rejoin': {
      const name = $('name').value.trim();
      if (!name) { toast('Choisis un pseudo.'); $('name').focus(); return; }
      store.set('lo-name', name);
      socket.emit('join', { id: myId, name, code: store.get('lo-room', null) });
      break;
    }
    case 'leave':
      socket.emit('leave'); S = null; urlCode = null; store.set('lo-room', null);
      history.replaceState(null, '', '/'); render(true);
      break;
    case 'custom':
      if (S.phase === 'clue') {
        draft.clue = $('clue-in').value; draft.custom = !draft.custom; key = ''; render();
        if (draft.custom) $('cl').focus();
      }
      break;
    case 'lock': sfx.lock(); socket.emit('guess', { value: live }); break;
    case 'reveal': socket.emit('forceReveal'); break;
    default: socket.emit(act); // start, reroll, skip, next, lobby
  }
});

render();
})();
</script>
</body>
</html>
